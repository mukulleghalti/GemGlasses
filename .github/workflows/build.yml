name: Build-APK

on:
  push:
    branches:
      - main
      - master
      - CameraTest

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to build"
        required: false
        default: "CameraTest"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ------------------------------------------------------------
      # VERIFY SECRETS
      # ------------------------------------------------------------
      - name: Verify required secrets
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_APP_SECRET: ${{ secrets.TOKEN_APP_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          GEMGLASSES_BACKEND_URL: ${{ secrets.GEMGLASSES_BACKEND_URL }}
        run: |
          set -e

          test -n "$GEMINI_API_KEY"
          test -n "$TOKEN_APP_SECRET"
          test -n "$META_APP_ID"
          test -n "$META_CLIENT_TOKEN"
          test -n "$GEMGLASSES_BACKEND_URL"

          echo "Required secrets are configured."

      # ------------------------------------------------------------
      # LOCAL.PROPERTIES
      # ------------------------------------------------------------
      - name: Write local.properties
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_APP_SECRET: ${{ secrets.TOKEN_APP_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          GEMGLASSES_BACKEND_URL: ${{ secrets.GEMGLASSES_BACKEND_URL }}
        run: |
          set -e

          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "TOKEN_APP_SECRET=$TOKEN_APP_SECRET"
            echo "META_APPLICATION_ID=$META_APP_ID"
            echo "META_CLIENT_TOKEN=$META_CLIENT_TOKEN"
