name: Build-APK

on:
  push:
    branches:
      - main
      - master
      - CameraTest
      - AddVideoPhotosave
      - Muse_voice-wake
      - Muse_ondevice-tokens

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to build"
        required: false
        default: "Muse_ondevice-tokens"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Verify required secrets
        shell: bash
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -e

          test -n "$META_APP_ID"
          test -n "$META_CLIENT_TOKEN"

          echo "Required secrets are configured."

      - name: Write local.properties
        shell: bash
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "META_APPLICATION_ID=$META_APP_ID" >> local.properties
          echo "META_CLIENT_TOKEN=$META_CLIENT_TOKEN" >> local.properties

          echo "local.properties created."

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gem-glasses-apk
          path: app/build/outputs/apk/debug/*.apk
