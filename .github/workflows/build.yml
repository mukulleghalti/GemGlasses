name: BuildAPK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "TOKEN_APP_SECRET=${{ secrets.TOKEN_APP_SECRET }}" >> local.properties
          echo "META_APPLICATION_ID=${{ secrets.META_APP_ID }}" >> local.properties
          echo "META_CLIENT_TOKEN=${{ secrets.META_CLIENT_TOKEN }}" >> local.properties
          echo "GEMGLASSES_BACKEND_URL=${{ secrets.GEMGLASSES_BACKEND_URL }}" >> local.properties
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug -Pgemglasses.useRealGlasses=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gem-glasses-apk
          path: app/build/outputs/apk/debug/*.apk
