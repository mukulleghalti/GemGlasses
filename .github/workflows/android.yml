name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No Meta DAT SDK / github_token in CI: build against the mock glasses
      # backend so the pipeline needs no secrets or hardware.
      - name: Unit tests (mock backend)
        run: ./gradlew testDebugUnitTest -Pgemglasses.useRealGlasses=false

      - name: Assemble debug APK (mock backend)
        run: ./gradlew assembleDebug -Pgemglasses.useRealGlasses=false
