org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35
android.enableJetifier=true

# Controls whether the real Meta DAT SDK is linked. Default is false so a fresh
# clone builds against the mock glasses backend with no github_token or hardware.
# Real-hardware builds opt in with -Pgemglasses.useRealGlasses=true (requires a
# github_token in local.properties — see README > Setup).
gemglasses.useRealGlasses=true
